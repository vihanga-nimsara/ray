<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <title>Ray</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/spotlight.css">
</head>
<body>
  <div class="spot-stage">
    <div class="t-dropdown spot-panel" id="spotPanel" data-origin="top-center" role="dialog" aria-modal="true" aria-label="Search applications">
      <div class="spot-input-row">
        <span class="spot-search-mark" aria-hidden="true" title="Drag to move">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10.8" cy="10.8" r="6.8"/>
            <path d="m15.8 15.8 4.5 4.5"/>
          </svg>
        </span>
        <input
          id="spotInput"
          type="text"
          placeholder="Search apps"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Search apps"
          aria-controls="spotList"
          aria-autocomplete="list"
          role="combobox"
          aria-expanded="true"
        >
        <button class="spot-settings" id="spotSettings" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h9M19 7h1M4 12h2M12 12h8M4 17h6M16 17h4"/>
            <circle cx="16" cy="7" r="2"/>
            <circle cx="9" cy="12" r="2"/>
            <circle cx="13" cy="17" r="2"/>
          </svg>
        </button>
      </div>

      <div class="spot-divider"></div>

      <div class="spot-scroll" id="spotScroll">
        <div class="t-skel spot-skel" id="spotSkel">
          <div class="t-skel-skeleton is-pulsing" id="spotSkeleton" aria-hidden="true">
            <div class="skel-row"><span class="skel-avatar"></span><span class="skel-line"></span></div>
            <div class="skel-row"><span class="skel-avatar"></span><span class="skel-line"></span></div>
            <div class="skel-row"><span class="skel-avatar"></span><span class="skel-line"></span></div>
            <div class="skel-row"><span class="skel-avatar"></span><span class="skel-line"></span></div>
            <div class="skel-row"><span class="skel-avatar"></span><span class="skel-line"></span></div>
          </div>

          <div class="t-skel-content" id="spotContent">
            <div class="spot-list" id="spotList" role="listbox" aria-label="Applications"></div>
            <div class="spot-empty" id="spotEmpty" hidden>
              <span class="spot-empty-title" id="spotEmptyTitle">No apps found</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/spotlight.js"></script>
</body>
</html>
